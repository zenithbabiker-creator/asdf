name: Build and Test Application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-all:
    name: Build Web App & Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Capacitor Core & Android CLI
        run: |
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Build Vite Web App
        run: npm run build

      - name: Initialize & Add Android Platform
        run: |
          # 1. إنشاء ملف الإعدادات في حال عدم وجوده
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "زون لتصاميم الحدائق" "com.zone.gardendesigns" --web-dir dist
          fi

          # 2. إضافة منصة الأندرويد مع إظهار تفاصيل الخطأ إن وجد
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # 3. مزامنة الملفات المجمعة
          npx cap sync android

      - name: Verify Android Directory & Make Gradle Executable
        run: |
          if [ ! -d "android" ]; then
            echo "::error::فشل إنشاء مجلد android بواسطة Capacitor!"
            exit 1
          fi
          cd android
          chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Web Dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-files
          path: dist/
