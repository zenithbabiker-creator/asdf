name: Build Web and Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-all:
    name: Build Web App & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Vite Web App
        run: npm run build

      - name: Convert Web App to Android (Capacitor)
        run: |
          # تثبيت Capacitor لتحويل الويب إلى أندرويد
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # تهيئة مشروع الأندرويد واختيار المجلد الناتج من Vite (dist)
          npx cap init "My App" "com.example.app" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Generate Default Icon for Android
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          # إنتاج أيقونة افتراضية للتطبيق
          convert -size 512x512 xc:"#3B82F6" -fill white -gravity center -pointsize 200 -draw "text 0,0 'A'" icon-base.png

          convert icon-base.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon-base.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon-base.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon-base.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon-base.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Grant Execute Permission for Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # رفع ملف الـ APK لتتمكن من تنزيله
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # رفع ملفات الويب أيضاً كنسخة احتياطية
      - name: Upload Web Dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-files
          path: dist/
