name: Build Web and Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-all:
    name: Build Web App & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Project Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Capacitor Packages
        run: npm install @capacitor/core @capacitor/android @capacitor/camera @capacitor/cli --save

      - name: Build Vite Web App
        run: npm run build

      - name: Prepare Capacitor & Android Project
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "زون لتصاميم الحدائق" "com.zone.gardendesigns" --web-dir dist
          fi

          # إزالة أي مجلد android ناقص ثم إعادته نظيفاً
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Generate App Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

          SOURCE_ICON=""
          for f in public/favicon.svg public/favicon.ico public/icon.png src/assets/icon.png; do
            if [ -f "$f" ]; then
              SOURCE_ICON="$f"
              break
            fi
          done

          if [ -n "$SOURCE_ICON" ]; then
            convert "$SOURCE_ICON" -resize 512x512 icon-base.png
          else
            convert -size 512x512 xc:"#2E7D32" \
              -fill "#4CAF50" -draw "circle 256,256 256,50" \
              -fill white -font "DejaVu-Sans-Bold" -pointsize 260 -gravity center -draw "text 0,0 '🌿'" \
              icon-base.png
          fi

          mkdir -p android/app/src/main/res/mipmap-mdpi \
                   android/app/src/main/res/mipmap-hdpi \
                   android/app/src/main/res/mipmap-xhdpi \
                   android/app/src/main/res/mipmap-xxhdpi \
                   android/app/src/main/res/mipmap-xxxhdpi

          convert icon-base.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon-base.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon-base.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon-base.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon-base.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          convert icon-base.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert icon-base.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert icon-base.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert icon-base.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          convert icon-base.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Grant Execute Permission for Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Web Dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-files
          path: dist/
