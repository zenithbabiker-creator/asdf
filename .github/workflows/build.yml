name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    name: Build Android App (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Project Dependencies
        run: npm install

      - name: Install Capacitor Core & Android Packages
        run: npm install @capacitor/core @capacitor/android @capacitor/camera @capacitor/cli --save

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor with Android
        run: npx cap sync android

      # خطوة حاسمة: التأكد من وجود ملف gradlew وإنشاؤه إن كان مفقوداً
      - name: Ensure Gradle Wrapper Exists
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating Gradle Wrapper..."
            gradle wrapper
          fi

      - name: Grant Execute Permission for Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-files
          path: dist/
