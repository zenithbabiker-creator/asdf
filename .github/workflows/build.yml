name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-android:
    name: Build Android App (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Project Dependencies
        run: npm install

      # 1. تثبيت حزم Capacitor المفتقدة بنفس الإصدارات المتوافقة
      - name: Ensure Capacitor Dependencies Installed
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/camera @capacitor/cli --save

      - name: Build Web App
        run: npm run build

      # 2. إجراء المزامنة باستخدام npx لضمان استخدام النسخة المحلية المثبتة في node_modules
      - name: Sync Capacitor with Android
        run: npx cap sync android

      # 3. منح صلاحيات التشغيل لملف gradlew داخل مجلد android
      - name: Grant Execute Permission for Gradle
        working-directory: android
        run: chmod +x gradlew

      # 4. بناء الـ APK
      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 5. رفع الـ APK الناتج كملف جاهز للتنزيل
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 6. رفع ملفات الويب المجمعة
      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-files
          path: dist/
